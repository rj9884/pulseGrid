name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend Test & Race Detection
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Verify Go dependencies
        run: |
          cd backend
          go mod verify

      - name: Run Go tests with Race Detector
        run: |
          cd backend
          go test -v -race -cover ./...

      - name: Build Go binaries
        run: |
          cd backend
          CGO_ENABLED=0 go build -v ./cmd/api
          CGO_ENABLED=0 go build -v ./cmd/migrate

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build
