name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend Test & Race Detection
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Verify Go dependencies
        run: |
          cd backend
          go mod verify

      - name: Run Go tests with Race Detector
        run: |
          cd backend
          go test -v -race -cover ./...

      - name: Build Go binaries
        run: |
          cd backend
          CGO_ENABLED=0 go build -v ./cmd/api
          CGO_ENABLED=0 go build -v ./cmd/migrate

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Start PostgreSQL & Redis
        run: |
          docker run -d --name postgres -e POSTGRES_USER=pulsegrid -e POSTGRES_PASSWORD=pulsegrid -e POSTGRES_DB=pulsegrid_db -p 5432:5432 postgres:16-alpine
          docker run -d --name redis -p 6379:6379 redis:7-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec postgres pg_isready -U pulsegrid -d pulsegrid_db > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Run Database Migrations
        run: |
          cd backend
          CGO_ENABLED=0 go build -v ./cmd/migrate
          ./migrate up

      - name: Start Backend
        run: |
          cd backend
          CGO_ENABLED=0 go build -v ./cmd/api
          ./api &
          # Wait for backend to be healthy
          for i in {1..30}; do
            if curl -s http://localhost:8080/healthz > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Start Frontend Preview Server
        run: |
          cd frontend
          NODE_ENV=development npm run start &
          # Wait for frontend to be ready
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Run Playwright Tests
        run: |
          cd frontend
          npx playwright test --project=chromium --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
