services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsegrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsegrid_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulsegrid_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsegrid} -d ${POSTGRES_DB:-pulsegrid_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsegrid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API service (build from source)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulsegrid-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://pulsegrid:pulsegrid_secret@postgres:5432/pulsegrid_db?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-pulsegrid_access_secret_super_secure_32_bytes_min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-pulsegrid_refresh_secret_super_secure_32_bytes_min}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-64}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-1000}
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CONSECUTIVE_FAILURES_THRESHOLD: ${CONSECUTIVE_FAILURES_THRESHOLD:-2}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend Next.js service (build from source)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pulsegrid-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SSE_URL: ${NEXT_PUBLIC_SSE_URL:-http://localhost:8080/api/v1/stream/events}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data: